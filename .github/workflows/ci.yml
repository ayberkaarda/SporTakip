name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SporTakip.sln
      - run: dotnet build SporTakip.sln -c Release --no-restore
      - name: Start LocalDB
        shell: pwsh
        run: |
          try {
            sqllocaldb start MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "LocalDB is unavailable; continuing."
              $global:LASTEXITCODE = 0
            } else {
              "SPORTAKIP_TEST_CONNECTION=Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=True;" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          } catch {
            Write-Warning "LocalDB is unavailable; continuing."
          }
      - run: dotnet test SporTakip.sln -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
      - name: Kapsam esigini denetle
        shell: pwsh
        run: |
          $coverageFile = Get-ChildItem -Path 'tests/SporTakip.Application.Tests/TestResults' -Filter 'coverage.cobertura.xml' -Recurse -File | Select-Object -First 1
          if (-not $coverageFile) {
            Write-Error 'Kapsam raporu bulunamadi.'
            exit 1
          }
          [xml]$coverage = Get-Content -Path $coverageFile.FullName
          $lineRate = [double]::Parse($coverage.coverage.GetAttribute('line-rate'), [Globalization.CultureInfo]::InvariantCulture)
          if ($lineRate -lt 0.80) {
            Write-Error ("Satir kapsami %{0:N2}; gereken en az %80." -f ($lineRate * 100))
            exit 1
          }
          Write-Host ("Satir kapsami %{0:N2}; esik karsilandi." -f ($lineRate * 100))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/coverage.cobertura.xml
          if-no-files-found: warn
